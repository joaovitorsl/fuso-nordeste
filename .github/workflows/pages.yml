name: Atualizar apoios e publicar
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar consulta e alternativa salva
        run: node scripts/test-live.mjs
      - name: Consultar a contagem oficial
        id: collect
        continue-on-error: true
        run: node scripts/update-history.mjs
      - name: Registrar medições novas
        id: save
        if: steps.collect.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet -- data/history.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/history.json
            git commit -m 'Atualiza histórico de apoios'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar página
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        with:
          path: public
      - name: Aguardar a disponibilidade do arquivo
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        run: sleep 15
      - name: Publicar no GitHub Pages
        id: deployment
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Sinalizar falha de consulta ao Senado
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'O Senado não respondeu; nenhuma medição foi alterada.'
          exit 1
